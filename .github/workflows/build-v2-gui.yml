name: Build HeadsetMicHotkey v2 GUI

on:
  push:
    branches: [ "v2-gui" ]
    paths:
      - "HeadsetMicHotkeyV2/**"
      - ".github/workflows/build-v2-gui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix source binding once
        shell: pwsh
        run: |
          $path = "HeadsetMicHotkeyV2\Program.cs"
          $source = Get-Content -LiteralPath $path -Raw
          $old = 'this.mainForm.RequestExit += ExitApplication;'
          $new = 'this.mainForm.RequestExit += delegate { ExitApplication(); };'
          if ($source.Contains($old)) {
            $source = $source.Replace($old, $new)
            Set-Content -LiteralPath $path -Value $source -Encoding UTF8
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add HeadsetMicHotkeyV2/Program.cs
            git commit -m "Fix RequestExit event binding"
            git push origin HEAD:v2-gui
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild HeadsetMicHotkeyV2\HeadsetMicHotkey.csproj /t:Restore /p:Configuration=Release

      - name: Build
        run: msbuild HeadsetMicHotkeyV2\HeadsetMicHotkey.csproj /p:Configuration=Release /p:RestorePackages=false

      - name: Show EXE size
        shell: pwsh
        run: |
          $exe = Get-Item "HeadsetMicHotkeyV2\bin\Release\net48\HeadsetMicHotkey.exe"
          Write-Host ("EXE size: {0:N2} MB ({1:N0} bytes)" -f ($exe.Length / 1MB), $exe.Length)

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "HeadsetMicHotkeyV2\bin\Release\net48\HeadsetMicHotkey.exe" "artifact\HeadsetMicHotkey.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HeadsetMicHotkey-v2-Windows
          path: artifact/HeadsetMicHotkey.exe
          if-no-files-found: error
